[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pager-hf"
version = "0.1.0"
description = "GPU <-> CPU KV-cache paging for HuggingFace transformers models, driven by a Rust pager."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "rust-llm-pager-core",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[tool.setuptools.packages.find]
include = ["pager_hf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py310"]
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 120
