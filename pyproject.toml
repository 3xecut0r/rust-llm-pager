[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pager-hf"
version = "0.1.0"
description = "GPU <-> CPU KV-cache paging for HuggingFace transformers models, driven by a Rust pager."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[tool.setuptools.packages.find]
include = ["pager_hf*"]
