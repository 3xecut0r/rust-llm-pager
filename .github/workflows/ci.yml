name: CI

on:
  push:
    branches: [prod, main]
  pull_request:

jobs:
  lint:
    name: Lint (black + isort, no GPU needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black isort
      - run: black --check pager_hf/ tests/ bench/
      - run: isort --check pager_hf/ tests/ bench/

  rust-tests:
    name: Rust pager core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  python-tests:
    name: Python tests (CPU-only, no GPU needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin and CPU-only dependencies
        run: |
          pip install maturin pytest black isort
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install -e . --no-deps
      - name: Build the Rust extension
        run: maturin develop -m pager/Cargo.toml --release
      - name: Byte-compile all Python sources
        run: python -m py_compile bench/*.py pager_hf/*.py
      - name: Run pytest
        run: python -m pytest tests/ -v

  packaging:
    name: Packaging (both wheels build and install together)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: pip install maturin
      - name: Build the rust-llm-pager-core wheel
        run: cd pager && maturin build --release
      - name: Build the pager-hf wheel
        run: pip wheel . --no-deps -w dist/
      - name: Install both wheels together and smoke-test the import
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install pager/target/wheels/*.whl dist/*.whl --no-deps
          python -c "import pager; import pager_hf; pager.PyPager(128_000_000, 2_000_000_000, 64, 4, 0.05, 0.20, 'recent_only'); print('pager_hf.PagedModel:', pager_hf.PagedModel)"
