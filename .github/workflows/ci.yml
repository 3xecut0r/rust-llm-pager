name: CI

on:
  push:
    branches: [prod, main]
  pull_request:

jobs:
  rust-tests:
    name: Rust pager core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pager
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  python-tests:
    name: Python tests (CPU-only, no GPU needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin and CPU-only dependencies
        run: |
          pip install maturin
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Build the Rust extension
        run: maturin develop -m pager/Cargo.toml --release
      - name: Byte-compile all Python sources
        run: python -m py_compile bench/*.py pager_hf/*.py
      - name: Run pytest
        run: python -m pytest tests/ -v
